<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">

    <button data-tab="library"><i>♫</i><span>Library</span></button>

    <button data-tab="settings"><i>⚙</i><span>Settings</span></button>

  <section id="player" class="hidden"></section>
  <div id="sheet" class="hidden"></div>
  <div id="toast"></div>

<div id="yt" aria-hidden="true"></div>
<script src="scenes.js"></script>
