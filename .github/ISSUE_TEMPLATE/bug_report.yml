name: Bug Report
description: Submit a bug report to help improve Echo Music
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please provide detailed information about the issue you are experiencing."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: Describe the issue...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to consistently reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device Information
      description: Device model and Android version.
      placeholder: Pixel 7, Android 14
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash Logs (Optional)
      description: Relevant stack traces or logcat output.
