name: Native port - compile original files

on:
  push:
    branches: [ "native-port" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile the portable original files on the JVM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'
      - name: Compile
        run: |
          set +e
          gradle --no-daemon --continue :orig-core:compileKotlin > build.log 2>&1
          echo "exit=$?" > exit.txt
          exit 0
      - name: Summarise errors
        run: |
          python3 -I - <<'PY'
          import re,collections
          log=open('build.log',errors='replace').read()
          errs=[l for l in log.splitlines() if l.startswith('e: ')]
          files=len(open('orig-core/files.txt').read().split())
          out=[f"exit {open('exit.txt').read().strip()}; {len(errs)} errors; {files} files listed"]
          kinds=collections.Counter(re.sub(r"^e: \S+ ","",e)[:90] for e in errs)
          unresolved=collections.Counter(m for e in errs for m in re.findall(r"Unresolved reference '([^']+)'",e))
          out.append("TOP UNRESOLVED: "+", ".join(f"{k}x{v}" for k,v in unresolved.most_common(40)))
          bad=collections.Counter(re.sub(r'.*/kotlin/','',e.split(':')[1] if False else e.split(' ')[1]).split(':')[0] for e in errs)
          out.append("FILES WITH ERRORS: %d; clean: %d"%(len(bad),files-len(bad)))
          if not errs: out.append("TAIL: "+" | ".join(log.splitlines()[-12:])[:1500])
          else: out.append("FIRST: "+" | ".join(kinds_ for kinds_ in list(kinds)[:12]))
          per=collections.defaultdict(list)
          for e in errs:
              m=re.match(r"e: file://(\S+?):(\d+):\d+ (.*)",e)
              if m: per[m.group(1).split('/kotlin/')[-1]].append(m.group(3)[:110])
          for f,l in sorted(per.items()): out.append(f"{f} [{len(l)}] "+" || ".join(dict.fromkeys(l[:3])))
          text="\n".join(out)
          chunks=[text[i:i+3600] for i in range(0,len(text),3600)]
          for n,c in enumerate(chunks):
              print("::notice title=Native port part %d::%s"%(n,c.replace('%','%25').replace('\n','%0A')))
          PY
