name: Pattukal iOS web app
on:
  push:
    branches: ["ios", "ios-liquid-pwa"]
    paths: ["ios/**", ".github/workflows/ios-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-ios
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ios
      - id: deploy
        uses: actions/deploy-pages@v4
