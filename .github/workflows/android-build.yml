name: Build & Direct APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Universal Standalone APK
        run: ./gradlew assembleUniversalFossDebug --no-daemon

      - name: Locate and Rename Direct APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} output_apk/SavishMusic-Release.apk \;

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.0-release-${{ github.run_number }}
          name: "Savish Music v1.0.0 (Build ${{ github.run_number }})"
          body: "Direct Installable Standalone APK (No ZIP, No Split-APKs)."
          files: output_apk/SavishMusic-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
