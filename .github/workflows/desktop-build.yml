name: Desktop build

on:
  push:
    branches: [ "desktop-port" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-jvm:
    name: Stage 1 - compile API layer and run smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'
      - name: Compile
        run: gradle --no-daemon :cli:classes 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Smoke test (search + stream URL)
        continue-on-error: true
        run: gradle --no-daemon :cli:run --args="Daft Punk Get Lucky" 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
      - name: Show smoke test output
        if: always()
        run: |
          set +e +o pipefail
          out=$(grep -vE '^\s*$|SLF4J|Daemon|Starting|Welcome|Download' run.log 2>/dev/null | tail -n 30 | cut -c1-250 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
          echo "::notice title=Smoke test output::${out:-run.log missing}"
      - name: Report errors as annotations
        if: failure()
        run: |
          set +e +o pipefail
          msg=$( (cat build.log; cat run.log) 2>/dev/null | grep -E '^e: |What went wrong|Could not|FAILED|Exception|error:' -A3 | head -40 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
          [ -z "$msg" ] && msg="no matching error lines; last lines: $( (tail -n 15 build.log) 2>/dev/null | cut -c1-200 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"
          echo "::error title=Stage 1 errors::$msg"

  windows-app:
    name: Stage 2 - build Windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'
      - name: Download portable VLC engine
        shell: pwsh
        run: |
          $base = "https://download.videolan.org/pub/videolan/vlc/last/win64/"
          $html = (Invoke-WebRequest -Uri $base -UseBasicParsing).Content
          $name = [regex]::Match($html, 'vlc-[0-9.]+-win64\.zip').Value
          if (-not $name) { throw "Could not find VLC zip in $base" }
          Write-Host "Using $name"
          Invoke-WebRequest -Uri ($base + $name) -OutFile vlc.zip
          Expand-Archive vlc.zip -DestinationPath vlc-extract
          $src = (Get-ChildItem vlc-extract -Directory | Select-Object -First 1).FullName
          $dst = "app/resources/windows/vlc"
          New-Item -ItemType Directory -Force $dst | Out-Null
          # Copy the whole VLC folder (helper DLLs, plugins, ...) minus parts we never use.
          Copy-Item "$src/*" $dst -Recurse
          foreach ($junk in @("skins", "msi", "vlc.exe", "Documentation.url", "New_Skins.url", "NEWS.txt", "README.txt", "THANKS.txt", "AUTHORS.txt", "COPYING.txt")) {
            Remove-Item "$dst/$junk" -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem $dst -Directory | Select-Object -ExpandProperty Name | Write-Host
          Get-ChildItem $dst -File -Filter *.dll | Select-Object -ExpandProperty Name | Write-Host
      - name: Build app distribution
        run: gradle --no-daemon :app:createDistributable 2>&1 | tee app-build.log; exit ${PIPESTATUS[0]}
      - name: Zip app
        shell: pwsh
        run: |
          $dir = Get-ChildItem -Path app/build/compose/binaries/main/app -Directory | Select-Object -First 1
          Compress-Archive -Path $dir.FullName -DestinationPath EchoMusic-windows.zip
      - name: Upload Windows app
        uses: actions/upload-artifact@v5
        with:
          name: EchoMusic-windows
          path: desktop/EchoMusic-windows.zip
      - name: Report errors as annotations
        if: failure()
        run: |
          set +e +o pipefail
          msg=$(cat app-build.log 2>/dev/null | grep -E '^e: |What went wrong|Could not|FAILED|Exception|error:' -A3 | head -40 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
          [ -z "$msg" ] && msg="no matching error lines; last lines: $(tail -n 15 app-build.log 2>/dev/null | cut -c1-200 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"
          echo "::error title=Windows app errors::$msg"
