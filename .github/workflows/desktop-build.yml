name: Desktop build

on:
  push:
    branches: [ "desktop-port" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-jvm:
    name: Stage 1 - compile API layer and run smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'
      - name: Compile
        run: gradle --no-daemon :cli:build 2>&1 | tee build.log
      - name: Smoke test (search + stream URL)
        run: gradle --no-daemon :cli:run --args="Daft Punk Get Lucky" 2>&1 | tee run.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stage1-logs
          path: |
            desktop/build.log
            desktop/run.log
