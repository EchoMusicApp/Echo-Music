name: Pattukal Release

on:
  push:
    branches:
      - "main"
      - "ui/paattukal-liquid-glass"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Serialize publication so older queued commits cannot overwrite the newest APK.
concurrency:
  group: pattukal-latest-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish APK from the same commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Wait for Android CI build for this exact commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_JSON="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/android-build.yml/runs?head_sha=${GITHUB_SHA}&per_page=10")"
            RUN_ID="$(echo "$RUN_JSON" | jq -r '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .status == "completed" and .conclusion == "success")] | sort_by(.updated_at) | last | .id // empty')"
            if [ -n "$RUN_ID" ]; then
              echo "Found successful Android CI run: $RUN_ID"
              break
            fi
            echo "Waiting for successful Android CI run for commit $GITHUB_SHA (attempt $attempt/60)..."
            sleep 30
          done
          if [ -z "$RUN_ID" ]; then
            echo "No successful Android CI build was found for this commit; refusing to publish a stale APK."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download optimized APK artifact from matching build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact extracted
          RUN_ID="${{ steps.build.outputs.run_id }}"
          ARTIFACT_JSON="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID/artifacts")"
          ARTIFACT_ID="$(echo "$ARTIFACT_JSON" | jq -r '[.artifacts[] | select(.name == "Pattukal-Optimized-APK" and .expired == false)] | first | .id // empty')"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "The matching build did not publish Pattukal-Optimized-APK."
            exit 1
          fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$ARTIFACT_ID/zip" > artifact/apk-artifact.zip
          unzip -q artifact/apk-artifact.zip -d extracted
          APK_PATH="$(find extracted -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK was found inside the optimized artifact from build $RUN_ID."
            exit 1
          fi
          cp "$APK_PATH" pattukal.apk
          APK_BYTES="$(stat -c '%s' pattukal.apk)"
          APK_MB="$(awk -v n="$APK_BYTES" 'BEGIN { printf "%.1f", n / 1048576 }')"
          echo "APK size: ${APK_MB} MiB"
          if [ "$APK_BYTES" -ge $((50 * 1024 * 1024)) ]; then
            echo "Optimized APK is 50 MiB or larger; refusing to publish it as the lightweight build."
            exit 1
          fi
          echo "APK source run: $RUN_ID"
          echo "APK source commit: $GITHUB_SHA"

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s pattukal.apk
          sha256sum pattukal.apk
          unzip -t pattukal.apk >/dev/null
          echo "APK archive verification passed."

      - name: Publish latest download and timestamp
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ui/paattukal-liquid-glass'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPDATED_AT="$(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          RUN_ID="${{ steps.build.outputs.run_id }}"
          BUILD_NUMBER="$(gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID" | jq -r '.run_number')"
          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$APP_VERSION" ] || [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" = "null" ]; then
            echo "Could not determine app version or Android CI build number."
            exit 1
          fi
          RELEASE_NOTES="$(printf 'New in Pattukal:\n\n- AMBIENCE on the Now Playing screen: rain, thunder, birds, river, ocean waves, wind, campfire and crickets.\n- New Nature theme and Nature player style.\n- Redesigned About screen with a 3D tilt card.\n- Pattukal is now the default theme (Follow system removed).\n- Vesper Fraktur is now the default font.\n- PATTUKAL heading now sits at the top of the home screen, with a refreshed violet-glow layout.\n- New animated PATTUKAL startup screen over a blurred app.\n- Optimized ARM64 APK, approximately 50 MiB, with smoother scrolling.\n- New app icon set (Pattukal Official plus four alternates).\n- Removed the startup confetti effect and fixed bugs.\n\nThis build is optimized for a lighter download and a smoother Pattukal experience; performance can vary by device.\n\nPattukal version: %s\nPattukal build: %s\nAndroid CI build: #%s\nAPK source run: #%s\nSource commit: %s\nRelease updated: %s\n\nPublished only after a successful Android CI build of this same commit.' "$APP_VERSION" "$BUILD_NUMBER" "$BUILD_NUMBER" "$RUN_ID" "$GITHUB_SHA" "$UPDATED_AT")"
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest pattukal.apk \
            --title "Pattukal Latest — Optimized 44 MB APK" \
            --target "$GITHUB_SHA" \
            --notes "$RELEASE_NOTES"
