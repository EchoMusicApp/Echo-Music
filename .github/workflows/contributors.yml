name: Update Contributors

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  contributors:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]

          url = f"https://api.github.com/repos/{repo}/contributors?per_page=100"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json"
              }
          )

          with urllib.request.urlopen(req) as r:
              contributors = json.load(r)

          avatars = []

          for user in contributors:
              username = user["login"]
              avatar = user["avatar_url"]

              avatars.append(
                  f'<a href="https://github.com/{username}">'
                  f'<img src="{avatar}" width="60" height="60" '
                  f'style="border-radius:99%;" />'
                  f'</a>'
              )

          html = ""

          for i in range(0, len(avatars), 8):
              html += "<p>\n"
              html += "\n".join(avatars[i:i+8])
              html += "\n</p>\n"

          start = "<!-- readme: contributors -start -->"
          end = "<!-- readme: contributors -end -->"

          with open("README.md", encoding="utf-8") as f:
              readme = f.read()

          before = readme.split(start)[0]
          after = readme.split(end)[1]

          readme = (
              before +
              start +
              "\n" +
              html +
              end +
              after
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update contributors"
            git push
          fi
