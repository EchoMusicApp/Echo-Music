name: Update Contributorname: Update Contributors

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get contributors and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          url = f"https://api.github.com/repos/{repo}/contributors?per_page=100"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              },
          )

          with urllib.request.urlopen(request) as response:
              contributors = json.load(response)

          avatars = []

          for contributor in contributors:
              username = contributor["login"]
              avatar = contributor["avatar_url"]

              avatars.append(
                  f'<a href="https://github.com/{username}">'
                  f'<img src="{avatar}" width="60" height="60" '
                  f'style="border-radius:50%;" alt="{username}" />'
                  f'</a>'
              )

          # 8 avatars per row
          rows = []

          for i in range(0, len(avatars), 8):
              row = avatars[i:i + 8]
              rows.append(
                  '<div>\n' +
                  ''.join(row) +
                  '\n</div>'
              )

          generated = "\n".join(rows)

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          start = "<!-- readme: contributors -start -->"
          end = "<!-- readme: contributors -end -->"

          before = readme.split(start)[0]
          after = readme.split(end)[1]

          new_readme = (
              before +
              start +
              "\n" +
              generated +
              "\n" +
              end +
              after
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No contributor changes."
          else
            git commit -m "chore: update contributors"
            git push
          fi
