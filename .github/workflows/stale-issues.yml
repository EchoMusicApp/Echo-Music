name: Stale Issues

on:
  schedule:
    - cron: "30 1 * * *"

  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Mark and close stale issues
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          operations-per-run: 100

          days-before-issue-stale: 10

          days-before-issue-close: 10

          days-before-pr-stale: -1
          days-before-pr-close: -1

          stale-issue-label: "stale"

          stale-issue-message: >
            This issue has been automatically marked as stale because
            there has been no activity for 10 days.

            If this issue is still relevant, please leave a comment
            with any additional information or updates.

          close-issue-message: >
            This issue has been automatically closed because there
            has been no activity since it was marked as stale.

            If the issue is still relevant, you may reopen it or
            create a new issue with additional information.
